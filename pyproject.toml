[project]
name = "traffic_predictor"
version = "0.1.0"
description = "toll traffic prediction"
authors = [{name = "mohamed-lahna", email = "mohamed.lahna@outlook.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "mlflow>=2.19.0",
    "scikit-learn>=1.0.1,<1.6.0",
    "darts>=0.32.0",
    "pandera[mypy]>=0.23.1",
    "omegaconf>=2.3.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]
dev = [
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "matplotlib>=3.10.0",
    "statsmodels>=0.14.4",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]

[tool.ruff]
# automatic fix when possible
fix = true
# define the default indent width
indent-width = 4
# define the default line length
line-length = 100
# define the default python version
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# exceptions for docstrings in tests
"tests/*.py" = ["D100", "D103"]

[tool.mypy]
# improve error messages
pretty = true
# enhance strictness level
strict = true
# check untyped definitions
check_untyped_defs = true
# all missing imports in code
ignore_missing_imports = true
python_version = "3.14"

[tool.coverage.run]
branch = true  # report coverage by branch (if)
source = ["src"]  # set the default source folder
omit = ["__main__.py","__init__.py","schemas.py"]  # exclude certain files from coverage report

[tool.coverage.report]
fail_under = 80  # Minimum coverage threshold
show_missing = true  # Show lines that are missing coverage

[tool.pytest.ini_options]
addopts = ["-vv","--cov"]  # increase the verbosity level & automatically generate coverage report
pythonpath = ["src"]  # set the default python path

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
